name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # torch and matplotlib are in requirements.txt for later model work.
      # Nothing in src/ or tests/ imports them, so CI installs the packages the suite uses.
      - name: Install test dependencies
        run: python -m pip install "numpy>=1.24" "scipy>=1.10" "pytest>=7.4" "pyserial>=3.5"
      - name: Run tests
        run: python -m pytest -q
